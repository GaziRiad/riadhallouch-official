name: Add detail shots to a project

# Manual only — no push trigger, so this can never fire as a side effect
# of committing something else. It writes exactly one field
# (detailImages) on the one slug given below; see the header comment in
# scripts/add-detail-shots.mts for why that guarantee matters here.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Project slug to add detail shots to (e.g. amuse)"
        required: true
      sources:
        description: 'One per line: a URL, "<url> :: <selector>", or file:scripts/assets/<slug>/shot.png'
        required: true
      dry_run:
        description: "Capture and show the shots without writing to Sanity"
        type: boolean
        default: false

jobs:
  add-detail-shots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Both inputs go through the environment rather than being
      # interpolated into the command line: a selector contains spaces and
      # punctuation the shell would otherwise split or interpret.
      - run: npx tsx scripts/add-detail-shots.mts "$SLUG" ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SLUG: ${{ inputs.slug }}
          DETAIL_SHOT_SOURCES: ${{ inputs.sources }}
          DETAIL_SHOT_OUTPUT_DIR: captured-shots
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      # Every capture is committed to a branch of its own so it can be
      # looked at — on GitHub, or by fetching the branch. A shot that came
      # back blank or landed on the wrong section passes every step above
      # identically, so "the job was green" proves nothing about framing.
      # The branch is force-pushed and holds only these images; nothing
      # reads it, and main never sees it.
      - name: Publish the captures for review
        if: always()
        run: |
          [ -d captured-shots ] || exit 0
          # checkout@v4 marks the workspace safe only for its own step, in
          # a temporary HOME it then discards, so git here sees a directory
          # owned by someone else and refuses to treat it as a repo.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan shot-previews
          git rm -rq --cached . || true
          git add -f captured-shots
          git commit -qm "Captures for $SLUG"
          git push -f origin shot-previews
        env:
          SLUG: ${{ inputs.slug }}
