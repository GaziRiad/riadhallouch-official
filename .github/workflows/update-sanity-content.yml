name: Update Sanity content

# Runs scripts/update-projects.mts automatically whenever it changes on
# main — creates project documents for slugs that don't have one yet,
# capturing and uploading live-site screenshots via Playwright. GitHub's
# runners have normal internet access, unlike the sandbox this repo is
# often edited from, so this is where the capture actually executes.
# Projects that already exist are skipped untouched, so a run triggered by
# one new case study cannot rewrite any of the others.
#
# One-time setup required in this repo's Settings → Secrets and
# variables → Actions:
#   SANITY_API_WRITE_TOKEN — an Editor-permission token from
#     https://www.sanity.io/manage → your project → API → Tokens
#   SANITY_PROJECT_ID      — e.g. fu3gbare
# (SANITY_DATASET defaults to "production" if not set as a repo variable.)

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-projects.mts"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npm run update:projects
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
